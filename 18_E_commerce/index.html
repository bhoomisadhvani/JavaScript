<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopNova</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">ShopNova</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav m-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="#"
                onclick="
                  showCartItem()
                  // return false;
                "
              >
                Cart <span id="cartCount"></span>
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link active"
                href="#"
                onclick="addProductModalShow()"
                >Add product</a
              >
            </li>
          </ul>

          <form class="d-flex" id="searchForm" role="search">
            <input
              class="form-control me-2"
              id="searchInput"
              type="search"
              placeholder="Search products"
              aria-label="Search products"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row" id="product"></div>

      <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h4 class="modal-title">Cart Items</h4>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>

            <div class="modal-body">
              <div class="table-responsive">
                <table
                  class="table table-striped table-hover table-bordered align-middle"
                >
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Image</th>
                      <th>Name</th>
                      <th>Price</th>
                      <th>Quantity</th>
                      <th>Total</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="table-body"></tbody>
                </table>
              </div>
            </div>

            <div class="modal-footer">
              <h5 class="me-auto" id="GrandTotal">Grand Total</h5>
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button
                type="button"
                class="btn btn-primary"
                onclick="checkOut()"
              >
                Check Out
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="modal" id="addProductModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Add Product</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form id="addProductForm">
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="productName"
                    name="ProductName"
                    placeholder="Product Name"
                    required
                  />
                  <label for="ProductName">Product Name</label>
                </div>
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="ProductPrice"
                    name="ProductPrice"
                    placeholder="Product Price"
                    required
                  />
                  <label for="ProductPrice">Product Price</label>
                </div>

                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="ProductImage"
                    name="ProductImage"
                    placeholder="Product Image"
                    required
                  />
                  <label for="ProductImage">Product Image</label>
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                  >
                    Close
                  </button>
                  <button
                    type="button"
                    class="btn btn-primary"
                    onclick="addProduct()"
                  >
                    Add Product
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="modal" id="updateProductModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">update Product</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form id="updateProductForm">
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="updateProductName"
                    name="ProductName"
                    placeholder="Product Name"
                    required
                  />
                  <label for="ProductName">Product Name</label>
                </div>
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="updateProductPrice"
                    name="ProductPrice"
                    placeholder="Product Price"
                    required
                  />
                  <label for="ProductPrice">Product Price</label>
                </div>

                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="updateProductImage"
                    name="ProductImage"
                    placeholder="Product Image"
                    required
                  />
                  <label for="ProductImage">Product Image</label>
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                  >
                    Close
                  </button>
                  <button
                    type="button"
                    class="btn btn-primary"
                    onclick="updateProduct()"
                  >
                    update Product
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
